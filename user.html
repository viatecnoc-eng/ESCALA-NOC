<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Escala de Plantão NOC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      background: #eaf2ff;
      color: #0f172a;
    }

    .container {
      max-width: 1150px;
      margin: 28px auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(30, 64, 175, 0.16);
      border: 1px solid #bfdbfe;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      border-bottom: 2px solid #bfdbfe;
      padding-bottom: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      color: #1d4ed8;
    }

    .subtitulo {
      color: #475569;
      font-size: 14px;
    }

    .acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: none;
      padding: 10px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-primario {
      background: #1d4ed8;
      color: #ffffff;
    }

    .btn-secundario {
      background: #dbeafe;
      color: #1e3a8a;
    }

    .btn-ativo {
      background: #1d4ed8 !important;
      color: #ffffff !important;
    }

    button:hover {
      filter: brightness(0.96);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px;
    }

    .card-info strong {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      color: #1e3a8a;
      margin-bottom: 5px;
    }

    .card-info span,
    .card-info a {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      text-decoration: none;
    }

    .card-info a {
      color: #1d4ed8;
    }

    .badge-origem {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px !important;
      font-weight: 800 !important;
      background: #dbeafe;
      color: #1d4ed8 !important;
    }

    .badge-emergencia {
      background: #fef3c7;
      color: #92400e !important;
    }

    .painel-filtros {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }

    .campo label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #1e3a8a;
      margin-bottom: 5px;
    }

    .campo select {
      width: 100%;
      padding: 11px;
      border: 1px solid #93c5fd;
      border-radius: 9px;
      font-size: 14px;
      background: #ffffff;
      color: #0f172a;
    }

    .campo select:focus {
      outline: 2px solid #2563eb;
      border-color: #2563eb;
    }

    .botoes-visualizacao {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .contador {
      font-size: 13px;
      color: #334155;
      font-weight: 700;
      margin: -4px 0 14px;
    }

    .aviso {
      margin: 12px 0 18px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 14px;
      display: none;
      white-space: pre-line;
    }

    .aviso.ok {
      display: block;
      border-color: #93c5fd;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .aviso.erro {
      display: block;
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }

    .aviso.alerta {
      display: block;
      border-color: #fde68a;
      background: #fffbeb;
      color: #92400e;
    }

    .legenda {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 14px 0 18px;
      font-size: 13px;
      color: #334155;
    }

    .legenda-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cor {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid #93c5fd;
    }

    .cor-util {
      background: #ffffff;
    }

    .cor-sabado {
      background: #fef3c7;
    }

    .cor-domingo {
      background: #fee2e2;
    }

    .cor-proximo {
      background: #dbeafe;
      border: 2px solid #1d4ed8;
    }

    .area-cards {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .area-cards.ativo {
      display: grid;
    }

    .card-plantao {
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 14px;
      background: #ffffff;
      box-shadow: 0 6px 14px rgba(30, 64, 175, 0.08);
    }

    .card-plantao.sabado {
      background: #fffbeb;
      border-color: #facc15;
    }

    .card-plantao.domingo,
    .card-plantao.feriado {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .card-plantao.proximo {
      outline: 3px solid #1d4ed8;
      outline-offset: -3px;
      background: #eff6ff;
    }

    .card-data {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-data strong {
      font-size: 17px;
      color: #1e3a8a;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 800;
      background: #dbeafe;
      color: #1d4ed8;
      white-space: nowrap;
    }

    .badge-feriado {
      background: #fee2e2;
      color: #991b1b;
    }

    .linha-card {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid #e2e8f0;
      font-size: 14px;
    }

    .linha-card span {
      color: #64748b;
      font-weight: 700;
    }

    .linha-card strong {
      color: #0f172a;
      text-align: right;
    }

    .obs-card {
      margin-top: 10px;
      background: rgba(219, 234, 254, 0.7);
      border-radius: 10px;
      padding: 9px;
      font-size: 13px;
      color: #1e3a8a;
      white-space: pre-line;
    }

    .tabela-wrapper {
      overflow-x: auto;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      display: none;
    }

    .tabela-wrapper.ativo {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      border: 1px solid #bfdbfe;
      padding: 9px;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: #1d4ed8;
      color: #ffffff;
      font-weight: 700;
    }

    .sabado td {
      background: #fef3c7;
      color: #92400e;
      font-weight: 700;
    }

    .domingo td,
    .feriado td {
      background: #fee2e2;
      color: #991b1b;
      font-weight: 700;
    }

    .proximo td {
      background: #dbeafe !important;
      color: #1e3a8a !important;
      font-weight: 700;
    }

    .proximo {
      outline: 3px solid #1d4ed8;
      outline-offset: -3px;
    }

    .observacoes {
      margin-top: 20px;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 16px;
      background: #eff6ff;
      color: #1e3a8a;
      white-space: pre-line;
      font-size: 14px;
    }

    .observacoes h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #1d4ed8;
    }

    .rodape {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    .vazio {
      padding: 16px;
      background: #f8fafc;
      border: 1px dashed #93c5fd;
      border-radius: 12px;
      color: #475569;
      text-align: center;
      font-weight: 700;
    }

    @media (max-width: 1000px) {
      .area-cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .painel-filtros {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 750px) {
      .container {
        margin: 0;
        border-radius: 0;
        padding: 14px;
      }

      .topo {
        flex-direction: column;
      }

      .acoes {
        width: 100%;
      }

      .acoes button {
        flex: 1;
      }

      .info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .area-cards {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 23px;
      }

      .botoes-visualizacao button {
        flex: 1;
      }

      .card-info span,
      .card-info a {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: #ffffff;
      }

      .container {
        margin: 0;
        max-width: none;
        box-shadow: none;
        border: none;
        border-radius: 0;
      }

      .acoes,
      .painel-filtros,
      .legenda {
        display: none !important;
      }

      .area-cards {
        display: none !important;
      }

      .tabela-wrapper {
        display: block !important;
        overflow: visible;
      }

      table {
        min-width: 0;
      }

      th,
      td {
        font-size: 10px;
        padding: 5px;
      }

      .observacoes {
        font-size: 12px;
      }

      @page {
        size: A4 landscape;
        margin: 10mm;
      }
    }

    :root {--public-font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable","Segoe UI",Arial,sans-serif;}
    body {font-family:var(--public-font);background:white;color:#1d1d1f;line-height:1.5;-webkit-font-smoothing:antialiased;}
    button,input,select {font-family:var(--public-font);}
    .topo {align-items:center;border-bottom:1px solid #e5e5ea;padding-bottom:22px;margin-bottom:24px;}
    .public-brand {display:flex;align-items:center;gap:18px;min-width:0;}
    .public-logo {width:130px;height:auto;object-fit:contain;}
    h1 {font-size:32px;color:#1d1d1f;font-weight:600;letter-spacing:-.035em;line-height:1.2;}
    .subtitulo {color:#6e6e73;font-size:14px;}
    button {border-radius:9px;min-height:42px;font-size:13px;font-weight:500;}
    .public-duty {display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
    .public-duty-card {border:1px solid #e5e5ea;border-left:3px solid #007aff;border-radius:12px;background:#f8fafc;padding:16px 20px;}
    .public-duty-card:first-child {border-left-color:#34c759;}
    .public-duty-card small {display:block;color:#6e6e73;font-size:12px;}
    .public-duty-card strong {display:block;font-size:23px;font-weight:550;letter-spacing:-.02em;margin:5px 0;}
    .public-duty-card span {display:block;font-size:12px;color:#6e6e73;}
    .info-grid {grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}
    .card-info {background:#fafbfc;border:1px solid #e5e5ea;border-radius:10px;padding:13px 16px;min-width:0;}
    .card-info label,.card-info small {font-size:11px;letter-spacing:0;text-transform:none;color:#6e6e73;}
    .card-info span {font-size:14px;font-weight:500;overflow-wrap:anywhere;}
    .painel-filtros {background:#f8fafc;border:1px solid #e5e5ea;border-radius:12px;padding:18px;gap:18px;align-items:end;}
    .campo label {font-size:12px;font-weight:500;text-transform:none;color:#6e6e73;margin-bottom:7px;}
    .campo select {font-size:14px;min-height:44px;border:1px solid #dbe1e8;border-radius:8px;background:white;max-width:100%;}
    .botoes-visualizacao {display:flex;background:#edf0f5;border-radius:9px;padding:3px;gap:3px;}
    .botoes-visualizacao button {background:transparent;color:#6e6e73;}
    .botoes-visualizacao .btn-ativo {background:#fff;color:#1d4ed8;box-shadow:0 1px 5px #00000012;}
    .legenda {font-size:12px;color:#6e6e73;gap:14px;flex-wrap:wrap;}
    .cor {width:13px;height:13px;border-radius:3px;}
    .contador {font-size:13px;color:#6e6e73;}
    .tabela-wrapper {border:1px solid #e5e5ea;border-radius:12px;overflow-x:auto;}
    table {width:100%;min-width:760px;}
    thead th {background:#f5f7fb;color:#475569;font-size:12px;font-weight:500;padding:13px 12px;border-color:#e5e5ea;}
    tbody td {font-size:14px;padding:12px;border-color:#e5e5ea;font-variant-numeric:tabular-nums;}
    .card-plantao {box-shadow:none;border-color:#e5e5ea;padding:18px;}
    .card-data strong {font-size:17px;letter-spacing:-.01em;color:#1d1d1f;}
    .linha-card {font-size:14px;padding:9px 0;color:#6e6e73;align-items:center;}
    .linha-card strong {color:#1d1d1f;font-weight:500;text-align:right;}
    .linha-card a {text-decoration:none;color:#007aff;}
    .badge {font-size:11px;font-weight:500;}
    .observacoes {background:#fafbfc;border:1px solid #e5e5ea;border-radius:12px;}
    @media screen {#areaPdf.container {width:100%;max-width:none;min-height:100vh;margin:0;padding:28px 36px;border:0;border-radius:0;box-shadow:none;}}
    @media(min-width:1400px){.area-cards {grid-template-columns:repeat(4,minmax(0,1fr));}}
    @media(max-width:1000px){.info-grid {grid-template-columns:repeat(3,minmax(0,1fr));}.painel-filtros {grid-template-columns:1fr 1fr;}.painel-filtros .campo:last-child {grid-column:1/-1;}}
    @media screen and (max-width:750px){
      #areaPdf.container {padding:20px 14px;}
      .topo {align-items:stretch;gap:18px;}
      .public-brand {gap:13px;}
      .public-logo {width:95px;}
      h1 {font-size:26px;}
      .subtitulo {font-size:12px;}
      .acoes {gap:8px;}
      .acoes button {min-height:44px;}
      .public-duty {grid-template-columns:1fr;gap:10px;}
      .public-duty-card {padding:13px 16px;}
      .public-duty-card strong {font-size:21px;}
      .info-grid {grid-template-columns:1fr 1fr;gap:8px;}
      .card-info {padding:11px 12px;}
      .info-grid .card-info:last-child {grid-column:1/-1;}
      .painel-filtros {grid-template-columns:1fr;padding:14px;gap:14px;}
      .painel-filtros .campo:last-child {grid-column:auto;}
      .area-cards {grid-template-columns:1fr;gap:12px;}
      .linha-card strong {max-width:65%;overflow-wrap:anywhere;}
      .legenda {gap:10px;font-size:11px;}
      .observacoes {padding:14px;}
    }
    @media print {.public-duty {display:none;} .public-logo {width:100px;} table {min-width:0;}}

  </style>
</head>

<body>
  <div class="container" id="areaPdf">
    <div class="topo">
      <div class="public-brand"><img src="logo_viatec.png" alt="ViaTec" class="public-logo"><div>
        <h1>Escala NOC</h1>
        <div class="subtitulo" id="subtitulo">Carregando escala...</div>
      </div></div>

      <div class="acoes">
        <button id="btnAtualizar" class="btn-secundario" type="button">Atualizar escala</button>
        <button id="btnPdf" class="btn-primario" type="button">Baixar PDF</button>
      </div>
    </div>

    <div id="publicDuty" class="public-duty" aria-live="polite"></div>
    <div class="info-grid">
      <div class="card-info">
        <strong>Mês/Ano</strong>
        <span id="mesAno">-</span>
      </div>

      <div class="card-info">
        <strong>Setor</strong>
        <span id="setor">-</span>
      </div>

      <div class="card-info">
        <strong>Telefone NOC</strong>
        <span id="telefone">-</span>
      </div>

      <div class="card-info">
        <strong>Atualizado em</strong>
        <span id="atualizadoEm">-</span>
      </div>

      <div class="card-info">
        <strong>Origem</strong>
        <span id="origemEscala" class="badge-origem">-</span>
      </div>
    </div>

    <div id="aviso" class="aviso"></div>

    <div class="painel-filtros">
      <div class="campo">
        <label>Ver plantões de</label>
        <select id="filtroPlantonista">
          <option value="">Todos os plantonistas</option>
        </select>
      </div>

      <div class="campo">
        <label>Período</label>
        <select id="filtroPeriodo">
          <option value="todos">Todos os plantões</option>
          <option value="proximos">Próximos plantões</option>
          <option value="hoje">Somente hoje</option>
        </select>
      </div>

      <div class="campo">
        <label>Visualização</label>
        <div class="botoes-visualizacao">
          <button id="btnCards" class="btn-secundario" type="button">Cartões</button>
          <button id="btnTabela" class="btn-secundario" type="button">Tabela completa</button>
        </div>
      </div>
    </div>

    <div id="contador" class="contador">-</div>

    <div class="legenda">
      <div class="legenda-item"><span class="cor cor-util"></span> Dia útil</div>
      <div class="legenda-item"><span class="cor cor-sabado"></span> Sábado</div>
      <div class="legenda-item"><span class="cor cor-domingo"></span> Domingo/Feriado</div>
      <div class="legenda-item"><span class="cor cor-proximo"></span> Próximo plantão</div>
    </div>

    <div id="cards" class="area-cards"></div>

    <div id="tabelaWrapper" class="tabela-wrapper">
      <table id="tabela">
        <thead>
          <tr>
            <th>Data</th>
            <th>Semana</th>
            <th>Feriado?</th>
            <th>Plantonista</th>
            <th>Horário</th>
            <th>Telefone</th>
            <th>Observação</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="observacoes">
      <h2>Observações gerais</h2>
      <div id="observacoes">-</div>
    </div>

    <div class="rodape">
      Escala de Plantão NOC
    </div>
  </div>

  <!-- NOC_RULES_START -->
  <script>
/* Configuração e regras compartilhadas entre administração e página pública. */
(function(root){
const team=['André','Bruno','Emanuel','Guilherme','João','Ricardo'];
const config=Object.freeze({start:'08:00',end:'21:50',minutes:830,timeZone:'America/Sao_Paulo'});
const horario=config.start+' às '+config.end;
function iso(br){return String(br).split('/').reverse().join('-');}
function date(br){return new Date(iso(br)+'T12:00:00Z');}
function allowed(name,br,vacations=[]){return team.includes(name)&&(name!=='João'||[0,1,6].includes(date(br).getUTCDay()))&&!vacations.some(v=>v.nome===name&&iso(br)>=v.inicio&&iso(br)<=v.fim);}
function consecutive(a,b){return Math.abs(date(a)-date(b))===86400000;}
function errors(data,neighbors=[]){
 const rows=data.linhas||[],out=[],vac=data.ferias||[];
 const days=new Date(Date.UTC(+data.ano,+data.mesNumero+1,0)).getUTCDate();
 if(rows.length!==days)out.push('O mês deve conter todos os '+days+' dias.');
 const seen=new Set();
 rows.forEach(r=>{
 const d=date(r.data),key=iso(r.data);
 if(!Number.isFinite(+d)||d.getUTCFullYear()!==+data.ano||d.getUTCMonth()!==+data.mesNumero||seen.has(key))out.push(r.data+': data inválida, duplicada ou fora do período.');
 seen.add(key);
 if(Number.isFinite(+d)&&['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getUTCDay()]!==r.semana)out.push(r.data+': dia da semana incorreto.');
 if(!allowed(r.plantonista,r.data,vac))out.push(r.data+': colaborador ausente, indisponível ou fora dos dias permitidos.');
 if(r.horario!==horario)out.push(r.data+': horário deve ser '+horario+'.');
 if(r.plantonista&&rows.concat(neighbors).some(o=>o!==r&&o.plantonista===r.plantonista&&consecutive(o.data,r.data)))out.push(r.data+': '+r.plantonista+' em dias consecutivos.');
 });return [...new Set(out)];
}
function generate(rows,vac=[],neighbors=[]){
 const stats=Object.fromEntries(team.map(n=>[n,{total:0,weekend:0,holiday:0}]));
 const result=rows.map(r=>({...r,plantonista:'',horario}));
 let attempts=0;
 function solve(i){if(i===result.length)return true;if(++attempts>100000)return false;
 const r=result[i],weekend=[0,6].includes(date(r.data).getUTCDay());
 const candidates=team.filter(n=>allowed(n,r.data,vac)&&!(i&&result[i-1].plantonista===n)&&!neighbors.some(o=>o.plantonista===n&&consecutive(o.data,r.data)));
 candidates.sort((a,b)=>score(a)-score(b)||team.indexOf(a)-team.indexOf(b));
 function score(n){const s=stats[n];return s.total+(weekend?s.weekend*1.6:0)+(r.feriado?s.holiday*2:0);}
 for(const n of candidates){r.plantonista=n;const s=stats[n];s.total++;s.weekend+=+weekend;s.holiday+=+!!r.feriado;
 if(solve(i+1))return true;s.total--;s.weekend-=+weekend;s.holiday-=+!!r.feriado;r.plantonista='';}
 return false;}
 if(!solve(0))throw new Error('Não foi possível preencher o período respeitando todas as regras. Revise as indisponibilidades.');
 return result;
}
function hours(count){const m=count*config.minutes;return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:config.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
root.NocRules={team,config,horario,iso,allowed,consecutive,errors,generate,hours,today};
})(globalThis);

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://zvhvxkwxrinflonpxzmp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_4RJB6lPQupdRhD94p2rOZA_KALCaBUZ";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);

    let dadosEscala = null;
    let linhasOriginais = [];
    let modoVisualizacao = window.innerWidth <= 750 ? 'cards' : 'tabela';
    let origemAtual = '';

    function escapeHtml(valor) {
      return String(valor ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function aviso(msg, tipo) {
      $('aviso').className = 'aviso ' + tipo;
      $('aviso').innerText = msg;
    }

    function limparAviso() {
      $('aviso').className = 'aviso';
      $('aviso').innerText = '';
    }

    function idEscalaMesAtual() {
      const hoje = new Date();
      const ano = hoje.getFullYear();
      const mes = String(hoje.getMonth() + 1).padStart(2, '0');

      return `noc-${ano}-${mes}`;
    }

    function dataBrParaDate(data) {
      const p = String(data).split('/');
      if (p.length !== 3) return null;

      const d = Number(p[0]);
      const m = Number(p[1]) - 1;
      const a = Number(p[2]);

      if (Number.isNaN(d) || Number.isNaN(m) || Number.isNaN(a)) return null;

      return new Date(a, m, d);
    }

    function dataEhHoje(dataBr) {
      const data = dataBrParaDate(dataBr);
      if (!data) return false;

      const hoje = new Date();

      data.setHours(0, 0, 0, 0);
      hoje.setHours(0, 0, 0, 0);

      return data.getTime() === hoje.getTime();
    }

    function dataEhFuturaOuHoje(dataBr) {
      const data = dataBrParaDate(dataBr);
      if (!data) return false;

      const hoje = new Date();

      data.setHours(0, 0, 0, 0);
      hoje.setHours(0, 0, 0, 0);

      return data >= hoje;
    }

    function formatarDataHora(valor) {
      if (!valor) return '-';

      const data = new Date(valor);

      if (Number.isNaN(data.getTime())) return '-';

      return data.toLocaleString('pt-BR', {
        dateStyle: 'short',
        timeStyle: 'short'
      });
    }

    function classeLinha(item) {
      if (item.feriado || item.semana === 'Domingo') return 'domingo';
      if (item.semana === 'Sábado') return 'sabado';
      return '';
    }

    function nomesPlantonistas(linhas) {
      return [...new Set(
        linhas
          .map((item) => item.plantonista)
          .filter((nome) => nome && nome !== '-')
      )].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    }

    function preencherFiltroPlantonistas(linhas) {
      const atual = $('filtroPlantonista').value;
      const nomes = nomesPlantonistas(linhas);

      $('filtroPlantonista').innerHTML = `
        <option value="">Todos os plantonistas</option>
        ${nomes.map((nome) => `<option value="${escapeHtml(nome)}">${escapeHtml(nome)}</option>`).join('')}
      `;

      if (nomes.includes(atual)) {
        $('filtroPlantonista').value = atual;
      }
    }

    function obterLinhasFiltradas() {
      const nome = $('filtroPlantonista').value;
      const periodo = $('filtroPeriodo').value;

      return linhasOriginais.filter((item) => {
        if (nome && item.plantonista !== nome) return false;

        if (periodo === 'proximos' && !dataEhFuturaOuHoje(item.data)) return false;
        if (periodo === 'hoje' && !dataEhHoje(item.data)) return false;

        return true;
      });
    }

    function descobrirProximoPlantao(linhas) {
      const futuras = linhas
        .filter((item) => dataEhFuturaOuHoje(item.data))
        .sort((a, b) => {
          const da = dataBrParaDate(a.data);
          const db = dataBrParaDate(b.data);
          return da - db;
        });

      return futuras[0] || null;
    }

    function montarCards(linhas, proximo) {
      if (!linhas.length) {
        $('cards').innerHTML = '<div class="vazio">Nenhum plantão encontrado para o filtro selecionado.</div>';
        return;
      }

      $('cards').innerHTML = linhas.map((item) => {
        const classe = classeLinha(item);
        const ehProximo = proximo && item.data === proximo.data && item.plantonista === proximo.plantonista;
        const telefone = item.telefone || dadosEscala?.telefoneNoc || '-';

        return `
          <div class="card-plantao ${classe} ${ehProximo ? 'proximo' : ''}">
            <div class="card-data">
              <strong>${escapeHtml(item.data)}</strong>
              <span class="badge ${item.feriado ? 'badge-feriado' : ''}">
                ${escapeHtml(item.feriado ? 'Feriado' : item.semana)}
              </span>
            </div>

            <div class="linha-card">
              <span>Plantonista</span>
              <strong>${escapeHtml(item.plantonista || '-')}</strong>
            </div>

            <div class="linha-card">
              <span>Horário</span>
              <strong>${escapeHtml(item.horario || '-')}</strong>
            </div>

            <div class="linha-card">
              <span>Telefone</span>
              <strong><a href="tel:${escapeHtml(String(telefone).replace(/[^+0-9]/g,''))}">${escapeHtml(telefone)}</a></strong>
            </div>

            ${item.observacao ? `<div class="obs-card">${escapeHtml(item.observacao)}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function montarTabela(linhas, proximo) {
      if (!linhas.length) {
        $('tbody').innerHTML = `
          <tr>
            <td colspan="7">Nenhum plantão encontrado para o filtro selecionado.</td>
          </tr>
        `;
        return;
      }

      $('tbody').innerHTML = linhas.map((item) => {
        const classe = classeLinha(item);
        const ehProximo = proximo && item.data === proximo.data && item.plantonista === proximo.plantonista;
        const telefone = item.telefone || dadosEscala?.telefoneNoc || '-';

        return `
          <tr class="${classe} ${ehProximo ? 'proximo' : ''}" data-data="${escapeHtml(item.data)}">
            <td>${escapeHtml(item.data)}</td>
            <td>${escapeHtml(item.semana)}</td>
            <td>${item.feriado ? 'Sim' : 'Não'}</td>
            <td>${escapeHtml(item.plantonista || '-')}</td>
            <td>${escapeHtml(item.horario || '-')}</td>
            <td>${escapeHtml(telefone)}</td>
            <td>${escapeHtml(item.observacao || '')}</td>
          </tr>
        `;
      }).join('');
    }

    function atualizarContador(linhasFiltradas) {
      const nome = $('filtroPlantonista').value;
      const periodo = $('filtroPeriodo').value;

      const partes = [];

      partes.push(`${linhasFiltradas.length} plantão(ões)`);

      if (nome) partes.push(`plantonista: ${nome}`);
      if (periodo === 'proximos') partes.push('somente próximos');
      if (periodo === 'hoje') partes.push('somente hoje');

      $('contador').innerText = partes.join(' • ');
    }

    function aplicarFiltros() {
      const linhas = obterLinhasFiltradas();
      const proximo = descobrirProximoPlantao(linhas);

      montarCards(linhas, proximo);
      montarTabela(linhas, proximo);
      atualizarContador(linhas);
    }

    function definirVisualizacao(modo) {
      modoVisualizacao = modo;

      const cardsAtivo = modo === 'cards';

      $('cards').classList.toggle('ativo', cardsAtivo);
      $('tabelaWrapper').classList.toggle('ativo', !cardsAtivo);

      $('btnCards').classList.toggle('btn-ativo', cardsAtivo);
      $('btnTabela').classList.toggle('btn-ativo', !cardsAtivo);
    }

    function preencherOrigem(idCarregado, carregouFallback) {
      const origem = $('origemEscala');

      if (carregouFallback) {
        origem.innerText = 'Atual manual';
        origem.className = 'badge-origem badge-emergencia';
        return;
      }

      origem.innerText = idCarregado.replace('noc-', '');
      origem.className = 'badge-origem';
    }

    function preencherPlantoesDestaque() {
      const hoje=NocRules.today();
      const atuais=linhasOriginais.filter(r=>r.plantonista);
      const atual=atuais.find(r=>NocRules.iso(r.data)===hoje);
      const proximo=atuais.filter(r=>NocRules.iso(r.data)>hoje).sort((a,b)=>NocRules.iso(a.data).localeCompare(NocRules.iso(b.data)))[0];
      function item(label,linha){return '<div class="public-duty-card"><small>'+label+'</small><strong>'+escapeHtml(linha?.plantonista||'Sem plantão publicado')+'</strong><span>'+escapeHtml(linha?linha.data+' · '+NocRules.horario:'Nenhuma data disponível na escala')+'</span></div>';}
      $('publicDuty').innerHTML=item('Plantão de hoje',atual)+item('Próximo plantão',proximo);
    }
    let ultimaVersaoPublica='';
    function preencherTela(dados, atualizadoBanco, idCarregado, carregouFallback = false) {
      ultimaVersaoPublica=JSON.stringify([idCarregado,atualizadoBanco,dados]);
      dadosEscala = dados;
      linhasOriginais = (dados.linhas || []).map(r=>({...r,horario:NocRules.horario}));
      origemAtual = idCarregado;

      const mes = dados.mes || '-';
      const ano = dados.ano || '-';
      const setor = dados.setor || 'NOC';
      const telefone = dados.telefoneNoc || '-';
      const whatsapp = dados.whatsappNoc || '';

      $('subtitulo').innerText = `${mes} de ${ano} · Sobreaviso das ${NocRules.config.start} às ${NocRules.config.end}`;
      preencherPlantoesDestaque();
      $('mesAno').innerText = `${mes} / ${ano}`;
      $('setor').innerText = setor;

      if (whatsapp) {
        $('telefone').innerHTML = `<a href="${escapeHtml(whatsapp)}" target="_blank">${escapeHtml(telefone)}</a>`;
      } else {
        $('telefone').innerText = telefone;
      }

      $('atualizadoEm').innerText = formatarDataHora(dados.atualizadoEm || atualizadoBanco);
      $('observacoes').innerText = dados.observacoes || '-';

      preencherOrigem(idCarregado, carregouFallback);
      preencherFiltroPlantonistas(linhasOriginais);
      aplicarFiltros();
      definirVisualizacao(modoVisualizacao);
    }

    async function buscarEscalaPorId(id) {
      const { data, error } = await supabase
        .from('escalas')
        .select('dados, atualizado_em')
        .eq('id', id)
        .maybeSingle();

      if (error) {
        console.error(`Erro ao buscar ${id}:`, error);
        throw error;
      }

      if (!data || !data.dados) return null;

      return data;
    }

    async function carregarEscala() {
      limparAviso();
      $('subtitulo').innerText = 'Carregando escala...';

      const idMes = idEscalaMesAtual();

      try {
        const manual = await buscarEscalaPorId('noc-atual');
        if (manual) { preencherTela(manual.dados,manual.atualizado_em,'noc-atual',true); aviso('Escala atual publicada manualmente pelo NOC.','ok'); return; }
        const escalaMes = await buscarEscalaPorId(idMes);

        if (escalaMes) {
          preencherTela(escalaMes.dados, escalaMes.atualizado_em, idMes, false);
          aviso('Escala do mês atual carregada com sucesso.', 'ok');

          setTimeout(() => {
            limparAviso();
          }, 1800);

          return;
        }

        const escalaAtual = await buscarEscalaPorId('noc-atual');

        if (escalaAtual) {
          preencherTela(escalaAtual.dados, escalaAtual.atualizado_em, 'noc-atual', true);
          aviso(
            `Ainda não existe escala salva para o mês atual (${idMes}).\nMostrando a escala atual manual como emergência.`,
            'alerta'
          );
          return;
        }

        aviso(
          `Nenhuma escala publicada para o mês atual (${idMes}) e nenhuma escala atual manual encontrada.\nEntre em contato com o NOC.`,
          'erro'
        );

        $('publicDuty').innerHTML='';
        $('subtitulo').innerText = 'Nenhuma escala publicada';
        $('mesAno').innerText = '-';
        $('setor').innerText = '-';
        $('telefone').innerText = '-';
        $('atualizadoEm').innerText = '-';
        $('origemEscala').innerText = '-';
        $('observacoes').innerText = '-';
        $('cards').innerHTML = '<div class="vazio">Nenhuma escala disponível.</div>';
        $('tbody').innerHTML = '<tr><td colspan="7">Nenhuma escala disponível.</td></tr>';
        $('contador').innerText = '0 plantão(ões)';
      } catch (erro) {
        console.error(erro);
        aviso('Erro inesperado ao carregar a escala.', 'erro');
        $('subtitulo').innerText = 'Erro ao carregar escala';
      }
    }

    let consultaAutomaticaEmAndamento=false;
    async function verificarAtualizacaoPublica() {
      if(document.hidden || consultaAutomaticaEmAndamento)return;
      consultaAutomaticaEmAndamento=true;
      try {
        const manual=await buscarEscalaPorId('noc-atual');
        const id=manual?'noc-atual':idEscalaMesAtual();
        const registro=manual||await buscarEscalaPorId(id);
        if(registro){
          const versao=JSON.stringify([id,registro.atualizado_em,registro.dados]);
          if(versao!==ultimaVersaoPublica){preencherTela(registro.dados,registro.atualizado_em,id,!!manual);limparAviso();}
        } else if(ultimaVersaoPublica){ultimaVersaoPublica='';await carregarEscala();}
      } catch(e){console.error('Falha temporária ao verificar atualização da escala:',e);}
      finally{consultaAutomaticaEmAndamento=false;}
    }

    function baixarPdf() {
      window.print();
    }

    $('btnAtualizar').onclick = carregarEscala;
    $('btnPdf').onclick = baixarPdf;

    $('filtroPlantonista').onchange = aplicarFiltros;
    $('filtroPeriodo').onchange = aplicarFiltros;

    $('btnCards').onclick = () => definirVisualizacao('cards');
    $('btnTabela').onclick = () => definirVisualizacao('tabela');

    definirVisualizacao(modoVisualizacao);
    carregarEscala();
    setInterval(verificarAtualizacaoPublica,30000);
    window.addEventListener('focus',verificarAtualizacaoPublica);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)verificarAtualizacaoPublica();});
    window.addEventListener('online',verificarAtualizacaoPublica);
  </script>
